# Deploys AYG Lab and the sprinter app to Vercel.
# Pull requests -> preview deploys. Pushes to main -> production deploys.
# Tests must pass first. See docs in the PR for the 5 secrets AJ adds.
name: Vercel deploy

on:
  pull_request:
    paths:
      - "business/coaching-app/**"
      - "track/sprinter-web-app/**"
      - ".github/workflows/vercel-deploy.yml"
  push:
    branches: [main]
    paths:
      - "business/coaching-app/**"
      - "track/sprinter-web-app/**"
      - ".github/workflows/vercel-deploy.yml"

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  test:
    name: Test ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: ayg-lab, dir: business/coaching-app }
          - { name: sprinter-app, dir: track/sprinter-web-app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run test suite
        working-directory: ${{ matrix.app.dir }}
        run: node tests/run-tests.js

  deploy:
    name: Deploy ${{ matrix.app.name }}
    needs: test   # tests gate the deploy: any failed test blocks both deploys
    runs-on: ubuntu-latest
    # Skip PRs from forks (they cannot read secrets)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: ayg-lab, dir: business/coaching-app, project: AYG_LAB }
          - { name: sprinter-app, dir: track/sprinter-web-app, project: SPRINTER }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pick project ID for this app
        run: |
          if [ "${{ matrix.app.project }}" = "AYG_LAB" ]; then
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_AYG_LAB }}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID_SPRINTER }}" >> "$GITHUB_ENV"
          fi
      - name: Check secrets are set
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret for $v (see PR notes)"; exit 1; fi
          done
      # The project's Root Directory is set in Vercel to the app folder,
      # so we pull settings and build from the repo root.
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app.name }}: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview for **${{ matrix.app.name }}**: ${{ steps.deploy.outputs.url }}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
            });
